databases:
  - name: operational-fog-db
    databaseName: op_fog_db
    user: op_fog_user
    plan: free

services:
  # 1. Node.js Express API & WebSocket Backend
  - type: web
    name: operational-fog-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: operational-fog-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # 2. React Vite Static Site Frontend
  - type: web
    name: operational-fog-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: redirect
        source: /
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: operational-fog-backend
          property: host
